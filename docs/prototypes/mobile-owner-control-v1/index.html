</style></head><body><div class="layout"><aside class="intro"><div class="wordmark">BRC / OWNER CONTROL</div><h1>持仓操作，<br>就在手边。</h1><p>手机操作端 · V1 交互预览</p><div class="tools"><p>交互原型 · 全部为模拟数据</p><div class="toolrow" id="desktopTools"></div><p style="margin-top:13px;margin-bottom:0">可切换失败场景；刷新会重置。无真实交易、登录或推送。</p></div></aside><div class="phone" id="phone"><div class="statusbar"><span>9:41</span><span>▰ ▰ ▰　▰</span></div><header class="top"><div class="logo"><svg viewBox="0 0 24 24"><path d="M4 18V6h7a4 4 0 0 1 0 8H4m7 0h3a3 3 0 0 1 0 6H4"/></svg>BRC <button class="pill demoBadge" onclick="openDemo()">模拟原型</button></div><button class="icon" aria-label="设备与通知" onclick="openSettings()"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-11 12h4"/></svg></button></header><main class="screen" id="screen"></main><nav class="nav" aria-label="主要页面" id="nav"></nav><div class="overlay" id="overlay" hidden><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="操作面板"></section></div><div id="toast" class="toast" role="status" hidden></div></div></div>
<script>
const icons={positions:'<path d="M4 5h16v15H4zM4 10h16M9 10v10"/>',orders:'<path d="M7 3h10v3h3v15H4V6h3zM8 11h8M8 15h8"/>',control:'<path d="M5 4v16M12 4v16M19 4v16"/><circle cx="5" cy="9" r="2" fill="currentColor"/><circle cx="12" cy="16" r="2" fill="currentColor"/><circle cx="19" cy="7" r="2" fill="currentColor"/>'};const svg=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const seed=()=>[{id:'bnb',coin:'BNB',side:'空',strategy:'SOR-1H',qty:3.93,entry:626.28,price:614.20,stop:620.63,dp:2,step:.01,tp:null},{id:'eth',coin:'ETH',side:'空',strategy:'SOR-1H',qty:1.207,entry:1911.99,price:1868.40,stop:1890.50,dp:2,step:.001,tp:{price:1835,qty:.302}},{id:'sol',coin:'SOL',side:'多',strategy:'CPM',qty:12.45,entry:74.80,price:77.30,stop:75.40,dp:2,step:.01,tp:null}];let positions=seed(),page='positions',globalEnabled=true,strategies={CPM:true,MI:false,MPG:true,BRF2:true,'SOR-1H':true},outcome='success',offline=false,pending=null,modal=null,returnFocus=null;const $=s=>document.querySelector(s),f=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}),q=n=>Number(n.toFixed(6)).toString(),pnl=p=>(p.price-p.entry)*p.qty*(p.side==='多'?1:-1),get=id=>positions.find(p=>p.id===id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){let s=$('#screen');$('#nav').innerHTML=Object.entries({positions:'持仓',orders:'委托',control:'主控'}).map(([k,v])=>`<button class="${page===k?'active':''}" ${page===k?'aria-current="page"':''} onclick="navigate('${k}')">${svg(icons[k])}${v}</button>`).join('');let alerts=(offline?'<div class="banner">网络未连接 · 显示上次模拟快照，操作暂不可用</div>':'')+(pending?`<button class="notice" style="width:100%;text-align:left" onclick="showProgress()">${pending.unknown?'结果待核实':'操作处理中'} · ${esc(pending.label)}　查看进度 →</button>`:'');if(page==='positions'){let total=positions.reduce((a,p)=>a+pnl(p),0);s.innerHTML=alerts+`<div class="titlebar"><h2>持仓 <span class="muted" style="font-size:17px">${positions.length}</span></h2><span class="online"><i class="dot"></i>模拟状态</span></div><div class="summary"><div class="tiny muted">当前浮盈亏 · USDT</div><div class="big ${total>=0?'green':'red'}">${total>=0?'+':''}${f(total)}</div><div class="summaryfoot"><span>全仓 · 5×</span><span>自动管理</span></div></div>`+(positions.length?positions.map(p=>`<article class="position"><div class="row"><div><span class="side ${p.side==='空'?'red':'green'}">${p.side==='空'?'卖出 / 空':'买入 / 多'}</span><span class="symbol">${p.coin}<span style="font-size:12px;font-weight:400;margin-left:4px">USDT</span></span><div class="meta"><span class="tag">${p.strategy}</span><span class="tag">5×</span></div></div><span class="tag auto">${pending?.id===p.id?'调整中':'自动管理'}</span></div><div class="pnl ${pnl(p)>=0?'green':'red'}">${pnl(p)>=0?'+':''}${f(pnl(p))}<small>USDT</small></div><div class="grid"><div><label>数量 (${p.coin})</label><b>${q(p.qty)}</b></div><div><label>入场价格</label><b>${f(p.entry)}</b></div><div><label>当前价格</label><b>${f(p.price)}</b></div></div><div class="protect"><span><span class="green">✓</span> 已确认止损</span><span>${f(p.stop)} USDT</span></div><div class="actions"><button onclick="openTrade('${p.id}','reduce')" ${locked(p)?'disabled':''}>减仓</button><button onclick="openTrade('${p.id}','stop')" ${locked(p)?'disabled':''}>止盈 / 止损</button><button onclick="openTrade('${p.id}','close')" ${locked(p)?'disabled':''}>全平</button></div></article>`).join(''):'<div class="empty">暂无持仓<br><span class="tiny">有新机会时，系统按启用规则运行。</span></div>');}else if(page==='orders'){s.innerHTML=alerts+`<div class="titlebar"><h2>当前委托</h2><span class="tiny muted">仅持仓相关</span></div>`+positions.map(p=>`<div class="order"><div class="row"><span class="symbol">${p.coin}USDT</span><span class="tag">${p.side} · ${p.strategy}</span></div><div class="kv"><span>系统保护 · 止损</span><span>${f(p.stop)}</span></div><div class="row tiny"><span class="muted">覆盖 ${q(p.qty)} ${p.coin} · 不可裸撤</span><button onclick="openTrade('${p.id}','stop')" ${locked(p)?'disabled':''}>调整</button></div>${p.tp?`<div class="divider"></div><div class="kv"><span>人工止盈</span><span>${f(p.tp.price)}</span></div><div class="row tiny"><span class="muted">退出 ${q(p.tp.qty)} ${p.coin}</span><div><button onclick="openTrade('${p.id}','tp')" ${locked(p)?'disabled':''}>修改</button><button onclick="confirmCancel('${p.id}')" ${locked(p)?'disabled':''}>取消</button></div></div>`:`<div class="row tiny"><span class="muted">未设置人工止盈</span><button onclick="openTrade('${p.id}','tp')" ${locked(p)?'disabled':''}>设置</button></div>`}</div>`).join('')+(positions.length?'':'<div class="empty">暂无持仓相关委托</div>');}else{s.innerHTML=alerts+`<div class="titlebar"><h2>主控</h2><span class="tag auto">服务器独立运行</span></div><div class="control"><div class="row"><div><h3>全局允许新开仓</h3><span class="tiny muted">${globalEnabled?'已开启 · 仍须通过风险门禁':'已暂停 · 保留策略原有选择'}</span></div>${toggle('global',globalEnabled)}</div></div><div class="subhead">策略 · 允许新开仓</div>`+Object.entries(strategies).map(([k,v])=>`<div class="control"><div class="row"><div><h3>${k}</h3><span class="tiny muted">${!v?'Owner已暂停':!globalEnabled?'已启用 · 受全局暂停限制':k==='BRF2'?'已启用 · 局部结构门禁仍有效':'已启用 · 等待合格机会'}</span></div>${toggle(k,v)}</div></div>`).join('')+``; }renderTools();}
function locked(p){return offline||!!pending}
function toggle(k,v){return `<button class="toggle ${v?'on':''}" role="switch" aria-label="${k==='global'?'全局':k}允许新开仓" aria-checked="${v}" onclick="confirmToggle('${k}')" ${offline||pending?'disabled':''}><span></span></button>`}
function navigate(k){page=k;render();$('#screen').scrollTop=0}
function show(content){if($('#overlay').hidden)returnFocus=document.activeElement;$('#overlay').hidden=false;$('#sheet').innerHTML='<div class="handle"></div>'+content;setTimeout(()=>$('#sheet').querySelector('button,input')?.focus(),0)}
function hide(){ $('#overlay').hidden=true;modal=null;returnFocus?.focus?.()}
function head(title){return `<div class="row"><h2>${title}</h2><button class="close" aria-label="关闭操作面板" onclick="hide()">×</button></div>`}
function openTrade(id,type){let p=get(id);if(!p||locked(p))return;modal={id,type};let close=type==='close';show(head(close?'市价全平':type==='reduce'?'市价减仓':'止盈 / 止损')+`<div class="subtitle">${p.coin}USDT · ${p.side} · ${p.strategy}</div>`+(type==='stop'||type==='tp'?`<div class="tabs"><button class="${type==='stop'?'active':''}" onclick="openTrade('${id}','stop')">止损</button><button class="${type==='tp'?'active':''}" onclick="openTrade('${id}','tp')">止盈</button></div>`:'')+(type==='reduce'?`<div class="field"><label for="quantity">减仓数量</label><div class="inputwrap"><input id="quantity" inputmode="decimal" value="${q(p.qty*.25)}" oninput="previewHint()"><span class="unit">${p.coin}</span></div><div class="chips">${[25,50,75].map(n=>`<button onclick="setPct(${n})">${n}%</button>`).join('')}</div></div><div class="kv"><span>可减数量</span><span>${q(p.qty)} ${p.coin}</span></div><div class="kv"><span>预计剩余</span><span id="remaining">${q(p.qty*.75)} ${p.coin}</span></div><div class="notice">市价成交 · 价格以实际成交为准</div>`:type==='stop'?`<div class="field"><label for="price">止损触发价</label><div class="inputwrap"><input id="price" inputmode="decimal" value="${p.stop}" oninput="previewHint()"><span class="unit">USDT</span></div></div><div class="kv"><span>已确认止损</span><span>${f(p.stop)}</span></div><div class="kv"><span>当前价格</span><span>${f(p.price)}</span></div><div class="kv"><span>触发时估算仓位盈亏</span><span id="estimate">${f((p.stop-p.entry)*p.qty*(p.side==='多'?1:-1))} U</span></div><div class="notice">估算未扣费用及滑点</div>`:type==='tp'?`${p.tp?'<div class="notice">修改现有人工止盈</div>':''}<div class="field"><label for="price">止盈目标价</label><div class="inputwrap"><input id="price" inputmode="decimal" placeholder="输入目标价格" value="${p.tp?.price||''}"><span class="unit">USDT</span></div></div><div class="field"><label for="percent">退出比例（当前仓位）</label><div class="inputwrap"><input id="percent" inputmode="decimal" value="25"><span class="unit">%</span></div><div class="chips">${[25,50,75,100].map(n=>`<button onclick="document.querySelector('#percent').value=${n}">${n}%</button>`).join('')}</div></div><div class="notice">结构止损可能先于止盈触发</div>`:`<div class="kv"><span>平仓数量</span><span>${q(p.qty)} ${p.coin}</span></div><div class="kv"><span>执行方式</span><span>市价</span></div><div class="notice">全平后清理本笔相关委托</div>`)+`<div class="error" id="error" role="alert"></div><button class="primary ${close?'danger':''}" onclick="prepareTrade()">${close?'预览全平':'预览并确认'}</button>`);}
function setPct(n){let p=get(modal.id);$('#quantity').value=q(p.qty*n/100);previewHint()}
function previewHint(){if(!modal)return;let p=get(modal.id);if($('#remaining'))$('#remaining').textContent=q(Math.max(0,p.qty-Number($('#quantity').value)))+' '+p.coin;if($('#estimate'))$('#estimate').textContent=f((Number($('#price').value)-p.entry)*p.qty*(p.side==='多'?1:-1))+' U'}
function prepareTrade(){let p=get(modal.id),type=modal.type,op={id:p.id,type,versionQty:p.qty},error='';if(type==='reduce'){op.qty=Number($('#quantity').value);if(!Number.isFinite(op.qty)||op.qty<=0||op.qty>=p.qty)error='请输入大于0且小于持仓的数量；全部退出请使用全平。';else{op.qty=Math.floor((op.qty+1e-9)/p.step)*p.step;if(op.qty<p.step||p.qty-op.qty<p.step)error='按模拟数量步长取整后，减仓或余量不足。';else if(p.tp&&p.tp.qty>p.qty-op.qty)error='现有止盈数量将超过余仓，请先修改或取消止盈。';}}if(type==='stop'||type==='tp'){op.price=Number($('#price').value);if(!Number.isFinite(op.price)||op.price<=0)error='请输入有效价格。';else if(type==='stop'&&((p.side==='空'&&(op.price>=p.stop||op.price<=p.price))||(p.side==='多'&&(op.price<=p.stop||op.price>=p.price))))error=p.side==='空'?'空仓止损须低于原止损，且高于当前价。':'多仓止损须高于原止损，且低于当前价。';else if(type==='tp'&&((p.side==='空'&&op.price>=p.price)||(p.side==='多'&&op.price<=p.price)))error='请在当前价格的盈利方向设置目标价。';if(type==='tp'){let pct=Number($('#percent').value);if(!Number.isFinite(pct)||pct<=0||pct>100)error='退出比例须大于0且不超过100%。';op.qty=Math.floor((p.qty*pct/100+1e-9)/p.step)*p.step;if(op.qty<p.step)error='退出数量不足模拟最小量。';}}if(error){$('#error').textContent=error;return}op.label=`${p.coin} ${ {reduce:'市价减仓',close:'市价全平',stop:'收紧止损',tp:p.tp?'替换人工止盈':'设置人工止盈'}[type]}`;let details=type==='reduce'?`<div class="kv"><span>减仓数量（按步长取整）</span><span>${q(op.qty)} ${p.coin}</span></div><div class="kv"><span>预计剩余</span><span>${q(p.qty-op.qty)} ${p.coin}</span></div>`:type==='close'?`<div class="kv"><span>退出数量</span><span>${q(p.qty)} ${p.coin}</span></div>`:`<div class="kv"><span>${type==='stop'?'新止损价':'目标价'}</span><span>${f(op.price)} USDT</span></div>${type==='tp'?`<div class="kv"><span>退出数量</span><span>${q(op.qty)} ${p.coin}</span></div>`:''}`;confirmOp(op,details)}
function confirmOp(op,details){modal={...op};show(head('确认操作')+`<div class="subtitle">${esc(op.label)}</div>`+details+`<div class="divider"></div><div class="kv"><span>操作后</span><span>${op.type==='close'?'结束交易并清理残单':op.id==='control'?'已有仓位继续管理':'剩余仓位继续自动管理'}</span></div>${op.type==='close'||op.type==='reduce'?'<div class="notice">市价执行以实际成交为准。</div>':''}<button class="primary ${op.type==='close'?'danger':''}" onclick="submitOp()">确认${op.type==='close'?'全平':'执行'}</button><button class="outline" onclick="hide()">暂不操作</button>`)}
function confirmCancel(id){let p=get(id);if(locked(p))return;confirmOp({id,type:'cancel',label:p.coin+' 取消人工止盈',versionQty:p.qty},`<div class="kv"><span>原止盈价</span><span>${f(p.tp.price)}</span></div><div class="notice">保护止损保持有效</div>`)}
function confirmToggle(k){if(offline||pending)return;let value=k==='global'?globalEnabled:strategies[k];confirmOp({id:'control',type:'toggle',key:k,value:!value,label:(k==='global'?'全局':k)+(value?'暂停新开仓':'恢复新开仓')},`<div class="notice">${value?'暂停新开仓，已有仓位继续管理。':'恢复新开仓许可，仍受风险门禁约束。'}${k==='global'?'':''}</div>`)}
function submitOp(){if(offline||pending)return;let op={...modal};if(op.id!=='control'&&get(op.id)?.qty!==op.versionQty){toast('仓位已变化，请重新预览');hide();return}pending={...op,outcome,token:Date.now()};let token=pending.token,result=outcome;render();showProgress();if(outcome!=='unknown')setTimeout(()=>{if(pending?.token===token)finish(op,result)},1800);else{pending.unknown=true;render();showProgress()}}
function showProgress(){if(!pending)return;let u=pending.unknown;show(head(u?'结果待核实':'正在处理')+`<div class="result"><div class="resulticon">${u?svg('<path d="M12 7v6m0 4h.01"/><circle cx="12" cy="12" r="9"/>'):'<div class="spinner"></div>'}</div><h2>${esc(pending.label)}</h2><p>${u?'暂未获得明确结果。系统将继续核实，请勿重复提交。已有保护不会因为页面关闭而撤销。':'请求已受理，正在核实模拟结果。你可以关闭面板，后台继续处理。'}</p><button class="primary" onclick="hide()">${u?'返回并等待核实':'返回持仓'}</button></div>`)}
function finish(op,result){if(!pending)return;let displayResult=!$('#overlay').hidden;if(result==='success'){let p=get(op.id);if(op.type==='reduce'){p.qty=Number((p.qty-op.qty).toFixed(6));}if(op.type==='close')positions=positions.filter(x=>x.id!==op.id);if(op.type==='stop')p.stop=op.price;if(op.type==='tp')p.tp={price:op.price,qty:op.qty};if(op.type==='cancel')p.tp=null;if(op.type==='toggle'){if(op.key==='global')globalEnabled=op.value;else strategies[op.key]=op.value}}pending=null;render();let success=result==='success';if(!displayResult){toast(op.label+(success?' · 已完成':' · 未执行'));return}show(head(success?'操作完成':'操作未执行')+`<div class="result"><div class="resulticon" style="${success?'':'color:var(--red);background:#f6465d15'}">${svg(success?'<path d="m6 12 4 4 8-8"/>':'<path d="m7 7 10 10M17 7 7 17"/>')}</div><h2>${esc(op.label)}</h2><p>${success?(op.type==='close'?'模拟仓位已归零，相关委托已清理。':op.type==='toggle'?'Owner开关已更新。已有仓位继续自动管理。':'模拟结果已确认，保护与剩余仓位保持一致。'):'模拟交易所明确拒绝，原仓位与保护保持不变。请返回检查输入后重新发起。'}</p><button class="primary" onclick="hide()">完成</button></div>`)}
function openSettings(){show(head('设备与通知')+`<div class="subtitle">设计预览 · 非真实认证状态</div><div class="kv"><span>可信设备</span><span>我的 iPhone · 模拟</span></div><div class="kv"><span>登录方式</span><span>长期会话 · 无 TOTP</span></div><div class="notice">正式版本由独立管理渠道首次绑定。换机或丢失后，可撤销旧设备。</div><div class="subhead">关键通知</div><p class="tiny muted" style="line-height:2">开仓且保护确认<br>人工操作完成或失败<br>平仓结果<br>需要介入的异常</p><button class="outline" onclick="showInstall()">添加到主屏幕说明</button>`)}
function showInstall(){show(head('放到主屏幕')+`<div class="subtitle">正式版本安装指引预览</div><p style="line-height:2">在 iPhone 的 Safari 中打开正式地址，点击分享按钮，再选择「添加到主屏幕」。</p><div class="notice">当前为本地原型，不提供真实安装、设备绑定或推送。关闭页面不会影响正式版本的服务器执行。</div><button class="primary" onclick="hide()">知道了</button>`)}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3500)}
function toolButtons(){return ['success','reject','unknown'].map((k,i)=>`<button class="${outcome===k?'selected':''}" onclick="setOutcome('${k}')">${['成功','明确拒绝','结果待核实'][i]}</button>`).join('')+`<button onclick="offline=!offline;render();if(modal?.type==='demo')openDemo()">${offline?'恢复网络':'模拟断网'}</button><button onclick="resetDemo()">重置</button>`+(pending?.unknown?'<button onclick="finish({...pending},\'success\')">模拟核实完成</button>':'')}
function renderTools(){if($('#desktopTools'))$('#desktopTools').innerHTML=toolButtons()}
function setOutcome(k){outcome=k;renderTools();if(modal?.type==='demo')openDemo()}
function openDemo(){show(head('原型演示控制')+`<div class="subtitle">仅切换本地模拟结果，无真实请求</div><div class="toolrow">${toolButtons()}</div><div class="notice">普通状态下可减仓、修改止盈止损、全平及切换主控。刷新或重置恢复样例仓位。</div>`);modal={type:'demo'}}
function resetDemo(){pending=null;positions=seed();page='positions';globalEnabled=true;strategies={CPM:true,MI:false,MPG:true,BRF2:true,'SOR-1H':true};offline=false;outcome='success';hide();render()}
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hide();if(e.key==='Tab'&&!$('#overlay').hidden){let a=[...$('#sheet').querySelectorAll('button:not(:disabled),input')];if(!a.length)return;if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});render();
</script></body></html>
