# Local PostgreSQL for Development
# Manual product local test database only. Never targets Tokyo.
# Usage: docker compose -f docker-compose.pg.yml up -d
name: brc-manual-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: brc-manual-pg
    restart: unless-stopped
    ports:
      - "127.0.0.1:55434:5432"
    environment:
      POSTGRES_DB: dingdingbot
      POSTGRES_USER: dingdingbot
      POSTGRES_PASSWORD: dingdingbot_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dingdingbot -d dingdingbot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
