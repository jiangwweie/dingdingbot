[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
markers =
    asyncio: mark test as async
    integration: mark test as integration test
    asyncio_mode(strict): disable asyncio for specific test files
    feedback_fast: stable sub-minute typed and contract feedback
    feedback_mainline: deterministic commit/mainline feedback
    feedback_release_only: complete release certification only
